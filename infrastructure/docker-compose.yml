name: sass-retail-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      # Secrets are REQUIRED (TICKET-103 / SEC-004): no defaults baked into the
      # repo — provide them via .env / environment (copy .env.example for dev).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      # Consumed by init/02-roles.sh (creates the app + migrate roles)
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (copy .env.example to .env)}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is required (copy .env.example to .env)}
    ports:
      # Host port 5432 is commonly taken by other local projects -> default 5433
      # Loopback-only (TICKET-107): Postgres must never be reachable from the
      # LAN — the app talks to it over the internal compose network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: retail-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      # Required (TICKET-103 / SEC-004) — never a repo default.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required (copy .env.example to .env)}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required (copy .env.example to .env)}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-retail}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      # Trust X-Forwarded-* from nginx so issuer/redirects use the public origin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    ports:
      # Loopback-only (TICKET-107): Keycloak's admin console is powerful; reach
      # it from the host via localhost, browsers go through nginx at :8082.
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Custom login themes (e.g. "retail") — served from /opt/keycloak/themes
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot deploy-time migrations: platform + every tenant schema.
  # Runs on every `up` (idempotent); fails loudly on errors.
  migrations:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      # NODE_ENV=development: this one-shot is part of the DEV stack, and the
      # @retail/env production guard (TICKET-103/SEC-004) would otherwise
      # reject the dev-stack credentials it legitimately consumes. Real
      # deployments run migrations from their own environment with
      # NODE_ENV=production, where the guard is active.
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-retail_migrate}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is required (copy .env.example to .env)}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # Same image and same command as production — only env vars differ.
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: retail-api
    environment:
      NODE_ENV: development
      API_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-retail_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required (copy .env.example to .env)}
      # Provisioning only (isolated in the onboarding module, see DB-003)
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is required (copy .env.example to .env)}
      JWT_ISSUER_URL: http://localhost:8082/realms/retail
      JWT_JWKS_URL: http://keycloak:8080/realms/retail/protocol/openid-connect/certs
      JWT_AUDIENCE: retail-api
      # Onboarding (Phase 4): scoped Keycloak service client (INFRA-011) + tenant migrations
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ONBOARDING_CLIENT_ID: ${KEYCLOAK_ONBOARDING_CLIENT_ID:-retail-onboarding}
      KEYCLOAK_ONBOARDING_CLIENT_SECRET: ${KEYCLOAK_ONBOARDING_CLIENT_SECRET:?KEYCLOAK_ONBOARDING_CLIENT_SECRET is required (copy .env.example to .env)}
      MIGRATIONS_DIR: /app/migrations
      CORS_ORIGIN: http://localhost:4200,http://localhost:8082
    ports:
      # Loopback-only (TICKET-107): direct API access is for local debugging;
      # browsers go through nginx.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    # Same image as production: static build served by nginx.
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: retail-web
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: retail-nginx
    ports:
      # Host port 80 is commonly taken by other local projects -> default 8082
      # Loopback-only (TICKET-107): the dev stack should not be exposed to the
      # LAN; production sits behind a TLS-terminating ingress instead.
      - "127.0.0.1:${NGINX_PORT:-8082}:80"
    environment:
      # Injected into nginx templates (X-Forwarded-Port for Keycloak issuer)
      NGINX_PUBLIC_PORT: ${NGINX_PORT:-8082}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # Disable the stock welcome-page server
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres-data:
