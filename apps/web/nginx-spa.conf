# SPA server for the built Angular app: deep links fall back to index.html.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Security headers (TICKET-104 / INFRA-008). Enforced ONLY here — not in
    # the outer nginx template — so every response carries exactly one set of
    # headers (duplicate CSP/X-Frame-Options headers make browsers reject or
    # intersect policies unpredictably). API responses get equivalents from
    # helmet; Keycloak sets its own. HSTS is deferred until TLS (TICKET-102).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tuned to the Angular production build: external scripts only, inline
    # styles (the build inlines critical CSS), same-origin data endpoints;
    # the silent-renew iframe targets the same origin via the realms proxy,
    # allowed by frame-src falling back to default-src 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    try_files $uri $uri/ /index.html;
  }
}
