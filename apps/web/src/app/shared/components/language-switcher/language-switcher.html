<div class="lang-switch" role="group" [attr.aria-label]="i18n.t('common.language')">
  @for (language of i18n.languages; track language) {
    <button
      type="button"
      [class.active]="i18n.lang() === language"
      [attr.aria-pressed]="i18n.lang() === language"
      (click)="select(language)"
    >
      <svg class="flag" viewBox="0 0 24 16" aria-hidden="true">
        @if (language === 'en') {
          <rect width="24" height="16" fill="#012169" />
          <path d="M0 0h3.5L24 12.5V16h-3.5L0 3.5ZM24 0h-3.5L0 12.5V16h3.5L24 3.5Z" fill="#fff" />
          <path d="M0 0h1.7L24 14.3V16h-1.7L0 1.7ZM24 0h-1.7L0 14.3V16h1.7L24 1.7Z" fill="#c8102e" />
          <path d="M10 0h4v16h-4ZM0 6h24v4H0Z" fill="#fff" />
          <path d="M11 0h2v16h-2ZM0 7h24v2H0Z" fill="#c8102e" />
        } @else {
          <rect width="8" height="16" fill="#002b7f" />
          <rect x="8" width="8" height="16" fill="#fcd116" />
          <rect x="16" width="8" height="16" fill="#ce1126" />
        }
      </svg>
      <span>{{ language === 'en' ? 'English' : 'Română' }}</span>
      @if (i18n.lang() === language) {
        <svg class="selected-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3.2 3.2L13 4.5" /></svg>
      }
    </button>
  }
</div>
