<aside class="sidebar" [class.menu-open]="menuOpen()" (keydown.escape)="closeMenu(); menuToggle.focus()">
  <div class="sidebar-header">
    <p class="brand">storeboard</p>
    <button #menuToggle matIconButton type="button" class="menu-toggle"
      [attr.aria-label]="i18n.t(menuOpen() ? 'common.closeMenu' : 'common.openMenu')"
      [attr.aria-expanded]="menuOpen()" aria-controls="workspace-menu"
      (click)="menuOpen.set(!menuOpen())">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @if (menuOpen()) {
          <path d="m6 6 12 12M6 18 18 6" />
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </div>
  <div class="menu-content" id="workspace-menu">
  <nav [attr.aria-label]="i18n.t('common.navigation')">
    <p class="heading">{{ heading() }}</p>
    @for (item of items(); track item.link) {
      <app-nav-item [label]="item.label" [link]="item.link" (click)="closeMenu()" />
    }
  </nav>
  <div class="user-panel">
    <app-language-switcher />
    @if (userName()) {
      <p class="user-name">{{ userName() }}</p>
    }
    <button type="button" (click)="signOut.emit()">{{ i18n.t('common.signOut') }}</button>
  </div>
  </div>
</aside>
