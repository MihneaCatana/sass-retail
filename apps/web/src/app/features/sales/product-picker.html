<form class="filters" (submit)="find($event)"><mat-form-field appearance="outline"><mat-label>{{i18n.t('sales.productSearch')}}</mat-label><input matInput [value]="search()" (input)="search.set(text($event))"></mat-form-field><button matButton="filled">{{i18n.t('sales.find')}}</button></form>
@if(products.isLoading()){<p role="status">{{i18n.t('sales.loading')}}</p>}
@else if(products.error()){<p role="alert">{{i18n.t('sales.error.generic')}}</p><button matButton (click)="products.reload()">{{i18n.t('sales.retry')}}</button>}
@else if(products.value();as data){<div class="catalog-results">@for(product of data.products;track product.id){<button matButton="outlined" [disabled]="disabled()" (click)="selected.emit(product)">{{product.name}} · {{product.sku}}</button>}@empty{<p>{{i18n.t('sales.noProducts')}}</p>}</div><div class="pager"><button matButton [attr.aria-label]="i18n.t('common.previous')" [disabled]="page()===1" (click)="page.set(page()-1)">‹</button><span>{{page()}}</span><button matButton [attr.aria-label]="i18n.t('common.next')" [disabled]="page()*20>=data.total" (click)="page.set(page()+1)">›</button></div>}
