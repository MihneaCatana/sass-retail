name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration verification (isolation, auth, onboarding)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack (same images as production)
        run: docker compose -f infrastructure/docker-compose.yml up -d --build
      - name: Wait for Keycloak realm + API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8082/realms/retail/.well-known/openid-configuration > /dev/null \
               && curl -sf http://localhost:8082/api/health/ready > /dev/null; then
              echo "Stack ready"; exit 0
            fi
            sleep 5
          done
          echo "Stack did not become ready in time"; docker compose -f infrastructure/docker-compose.yml logs --tail=50; exit 1
      - name: Configure realm (declarative user profile)
        run: pnpm --filter @retail/tools configure:keycloak
      - name: Tenant isolation
        run: pnpm --filter @retail/tools test:isolation
      - name: OIDC flow
        run: pnpm --filter @retail/tools verify:auth
      - name: Onboarding flow
        run: pnpm --filter @retail/tools verify:onboarding
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs --tail=100
